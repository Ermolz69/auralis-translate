name: Publish translation report

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
      - eval/scripts/check-public-demo-site.mjs
      - eval/reports/public-demo-2026-09-27.json
      - eval/reports/public-demo-fidelity-2026-09-27.json
      - eval/reports/currency-controls-2026-09-27.json
      - eval/scripts/currency-report-section.mjs
      - eval/scripts/model-comparison-section.mjs
      - eval/reports/model-size-comparison-2026-09-27.json
      - eval/corpora/model-size-review-v1.json
      - models/manifests/hy_mt2_7b_q4_k_m.fidelity.experimental.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify report
        run: node eval/scripts/check-public-demo-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
