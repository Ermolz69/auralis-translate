[workspace]
members = [
    "crates/auralis-translation",
    "crates/auralis-translation-formats",
    "crates/auralis-translation-llamacpp",
    "crates/auralis-translation-sqlite",
    "crates/auralis-translation-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
