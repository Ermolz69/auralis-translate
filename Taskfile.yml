version: "3"

tasks:
  eval:clean-windows:check:
    desc: Verify separate QA preparation, installer identity and unexecuted report boundaries
    cmds:
      - node --test eval/scripts/tests/clean-windows-qa.test.mjs
  eval:clean-windows:prepare:
    desc: Copy an audited MSI and independent authored diagnostics into a new QA directory without model weights
    requires:
      vars: [AURALIS_ROOT, OUTPUT_DIR, AURALIS_REVISION, TRANSLATE_REVISION]
    cmds:
      - task: eval:clean-windows:check
      - node eval/scripts/clean-windows-qa.mjs "{{.AURALIS_ROOT}}" "{{.OUTPUT_DIR}}" "{{.AURALIS_REVISION}}" "{{.TRANSLATE_REVISION}}"
  fetch:
    cmds:
      - cargo fetch
  build:
    cmds:
      - cargo build --workspace --offline
  build:release:
    desc: Build the optimized standalone CLI without downloading dependencies or models
    cmds:
      - cargo build --release --offline -p auralis-translation-cli
  test:
    cmds:
      - cargo test --workspace --offline
  test:verified-server:
    cmds:
      - cargo test --offline -p auralis-translation-cli --test verified_server
  test:request-cancellation:
    desc: Verify response-header/body interruption, provider reuse, and durable CLI pause
    cmds:
      - cargo test --offline -p auralis-translation-llamacpp --test request_cancellation
      - cargo test --offline -p auralis-translation --test retry_policy
      - cargo test --offline -p auralis-translation-cli --test cli_resume pause_preserves_committed_blocks_and_resume_finishes
  fmt:
    cmds:
      - cargo fmt --all -- --check
  fmt:fix:
    cmds:
      - cargo fmt --all
  lint:
    cmds:
      - cargo clippy --workspace --all-targets --offline -- -D warnings
  check:
    cmds:
      - task: fmt
      - task: lint
      - task: test
  docs:check:
    desc: Check local file links in active English documentation and experiment records
    cmds:
      - node eval/scripts/check-doc-links.mjs
  inspect:
    cmds:
      - cargo run --offline -p auralis-translation-cli -- inspect {{.CLI_ARGS}}
  cli:
    cmds:
      - cargo run --offline -p auralis-translation-cli -- {{.CLI_ARGS}}
  eval:flores:verify:
    cmds:
      - cargo run --offline -p auralis-translation-eval -- verify-flores eval/corpora/flores200-archive-b8b0b767.json .cache/eval/flores200_dataset.tar.gz .cache/eval/flores200_dataset
  eval:flores:compare:
    cmds:
      - cargo run --offline -p auralis-translation-eval -- compare-flores eval/corpora/flores200-archive-b8b0b767.json .cache/eval/flores200_dataset.tar.gz .cache/eval/flores200_dataset {{.CLI_ARGS}}
  eval:cli:vtt:interruption:
    desc: Kill and resume a standalone WebVTT CLI run with an installed checked local model
    cmds:
      - task: build
      - node eval/scripts/cli-vtt-interruption.mjs
  eval:file:checks:
    desc: Verify the auxiliary file comparison harness rejects structure and identity changes
    cmds:
      - node --test eval/scripts/tests/file-probe.test.mjs
      - node --test eval/scripts/tests/profile-comparison.test.mjs
  eval:cli:flores:file:
    desc: Run real Chinese sentence comparisons through a durable SRT transport fixture; keep data and reports in ignored storage
    cmds:
      - task: build
      - task: eval:file:checks
      - node eval/scripts/cli-flores-file.mjs
  eval:cli:flores:profiles:
    desc: Compare pinned decoding and prompt variants through identical local dev sentence fixtures without downloading assets
    cmds:
      - task: build
      - task: eval:file:checks
      - node eval/scripts/cli-flores-profiles.mjs
  eval:profiles:verify:
    desc: Verify a completed local comparison against the pinned matrix and retained artifact hashes without inference
    requires:
      vars: [REPORT_DIR]
    cmds:
      - node eval/scripts/verify-profile-comparison.mjs "{{.REPORT_DIR}}"
  eval:load:checks:
    desc: Check synthetic long-file fixture, checkpoint preservation and process-capture contracts
    cmds:
      - node --test eval/scripts/tests/long-file.test.mjs
      - node --test eval/scripts/tests/local-process.test.mjs
  eval:cli:long:interruption:
    desc: Kill and resume real long SRT and WebVTT runs with supplied checked assets; retain local comparison and resource reports
    cmds:
      - task: build:release
      - task: eval:load:checks
      - node eval/scripts/cli-long-file.mjs
  eval:cli:request-pause:
    desc: Pause observed active checked-model inference, preserve checkpoints, resume SRT/WebVTT and re-export offline
    cmds:
      - task: build:release
      - task: test:request-cancellation
      - node eval/scripts/cli-request-pause.mjs
