      - cargo run --offline -p auralis-translation-eval -- compare-flores eval/corpora/flores200-archive-b8b0b767.json .cache/eval/flores200_dataset.tar.gz .cache/eval/flores200_dataset {{.CLI_ARGS}}
  eval:cli:vtt:interruption:
    desc: Kill and resume a standalone WebVTT CLI run with an installed checked local model
    cmds:
      - task: build
      - node eval/scripts/cli-vtt-interruption.mjs
  eval:file:checks:
    desc: Verify the auxiliary file comparison harness rejects structure and identity changes
    cmds:
      - node --test eval/scripts/tests/file-probe.test.mjs
      - node --test eval/scripts/tests/profile-comparison.test.mjs
  eval:cli:flores:file:
    desc: Run real Chinese sentence comparisons through a durable SRT transport fixture; keep data and reports in ignored storage
    cmds:
      - task: build
      - task: eval:file:checks
      - node eval/scripts/cli-flores-file.mjs
  eval:cli:flores:profiles:
    desc: Compare pinned decoding and prompt variants through identical local dev sentence fixtures without downloading assets
    cmds:
      - task: build
      - task: eval:file:checks
      - node eval/scripts/cli-flores-profiles.mjs
  eval:profiles:verify:
    desc: Verify a completed local comparison against the pinned matrix and retained artifact hashes without inference
    requires:
      vars: [REPORT_DIR]
    cmds:
      - node eval/scripts/verify-profile-comparison.mjs "{{.REPORT_DIR}}"
  eval:load:checks:
    desc: Check synthetic long-file fixture, checkpoint preservation and process-capture contracts
    cmds:
      - node --check eval/scripts/run-long-format.mjs
      - node --test eval/scripts/tests/long-file.test.mjs
      - node --test eval/scripts/tests/local-process.test.mjs
      - node --test eval/scripts/tests/long-run-budget.test.mjs
      - node --test eval/scripts/tests/relocate-copied-source.test.mjs
  eval:cli:long:interruption:
    desc: Kill and resume real long SRT and WebVTT runs with supplied checked assets; retain local comparison and resource reports
    cmds:
      - task: build:release
      - task: eval:load:checks
      - node eval/scripts/cli-long-file.mjs
  eval:cli:request-pause:
    desc: Pause observed active checked-model inference, preserve checkpoints, resume SRT/WebVTT and re-export offline
    cmds:
      - task: build:release
      - task: test:request-cancellation
      - node eval/scripts/cli-request-pause.mjs
