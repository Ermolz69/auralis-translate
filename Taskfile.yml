version: "3"

tasks:
  eval:journal:preflight:probe:
    desc: Verify real v5 token preflight and chat rows against one frozen authored scene
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-1.8B-Q4_K_M.gguf'
      AURALIS_SCENE_DATASET: eval/corpora/context-contrasts-v1.json
      AURALIS_SCENE_CASE_IDS: p01
      AURALIS_SCENE_EXPERIMENT: inference-preflight-p01-v1
    cmds:
      - task: eval:context:scene:check
      - task: test:inference-journal
      - task: build:release
      - node eval/scripts/scene-context-smoke.mjs
      - python eval/scripts/check-inference-journal.py .cache/eval/inference-preflight-p01-v1/latest.txt
  eval:journal:legacy:check:
    desc: Keep the previous v7 chat-only journal report readable after schema 8
    cmds:
      - python eval/scripts/check-inference-journal.py .cache/eval/inference-journal-paired-v1/latest.txt
  eval:journal:paired:
    desc: Compare one frozen authored Chinese scene with and without context and verify real SQLite chat traces
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-1.8B-Q4_K_M.gguf'
      AURALIS_SCENE_DATASET: eval/corpora/context-contrasts-v1.json
      AURALIS_SCENE_CASE_IDS: p01
      AURALIS_SCENE_EXPERIMENT: inference-journal-paired-v1
    cmds:
      - task: eval:context:scene:check
      - python -c "import ast; from pathlib import Path; ast.parse(Path('eval/scripts/check-inference-journal.py').read_text(encoding='utf-8'))"
      - task: build:release
      - node eval/scripts/scene-context-smoke.mjs
      - python eval/scripts/check-inference-journal.py .cache/eval/inference-journal-paired-v1/latest.txt
  eval:context:7b:probe:
    desc: Screen the pinned 7B Q4 model on the same authored three-cue context scene
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-7B-Q4_K_M.gguf'
      AURALIS_SCENE_MODEL_VARIANT: 7b
      AURALIS_SCENE_DATASET: eval/corpora/context-contrasts-v1.json
      AURALIS_SCENE_CASE_IDS: p01
      AURALIS_SCENE_EXPERIMENT: context-7b-p01-screen-v1
    cmds:
      - task: eval:context:scene:check
      - task: test:model-profiles
      - task: build:release
      - node eval/scripts/scene-context-smoke.mjs
  eval:context:7b:journal:check:
    desc: Match every real 7B p01 chat body and accepted target to its durable SQLite journal
    cmds:
      - python eval/scripts/check-inference-journal.py .cache/eval/context-7b-p01-screen-v1/latest.txt
  eval:context:pronouns:1b:probe:
    desc: Compare isolated and scene v5 on four frozen actor-context cases with the checked 1.8B model
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-1.8B-Q4_K_M.gguf'
      AURALIS_SCENE_DATASET: eval/corpora/context-contrasts-v1.json
      AURALIS_SCENE_CASE_IDS: p01,p02,p03,p04
      AURALIS_SCENE_EXPERIMENT: pronouns-1b-p01-p04-v1
    cmds:
      - task: eval:context:scene:check
      - task: build:release
      - node eval/scripts/scene-context-smoke.mjs
  eval:context:pronouns:7b:probe:
    desc: Repeat the identical four actor-context cases with the checked 7B model
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-7B-Q4_K_M.gguf'
      AURALIS_SCENE_MODEL_VARIANT: 7b
      AURALIS_SCENE_DATASET: eval/corpora/context-contrasts-v1.json
      AURALIS_SCENE_CASE_IDS: p01,p02,p03,p04
      AURALIS_SCENE_EXPERIMENT: pronouns-7b-p01-p04-v1
    cmds:
      - task: eval:context:scene:check
      - task: test:model-profiles
      - task: build:release
      - node eval/scripts/scene-context-smoke.mjs
  eval:context:pronouns:journal:check:
    desc: Match both four-scene model reports to durable tokenizer and chat requests
    cmds:
      - python eval/scripts/check-inference-journal.py .cache/eval/pronouns-1b-p01-p04-v1/latest.txt
      - python eval/scripts/check-inference-journal.py .cache/eval/pronouns-7b-p01-p04-v1/latest.txt
  eval:context:pronouns:report:check:
    desc: Validate frozen matched 1.8B/7B actor-context reports and source-only prompts
    cmds:
      - node eval/scripts/check-scene-pronoun-regression.mjs
  test:inference-journal:
    desc: Verify durable inference request identity, failure retention and schema upgrade
    cmds:
      - cargo test --offline -p auralis-translation-sqlite --test inference_requests --test migrations
      - cargo test --offline -p auralis-translation-llamacpp --test context_v5
  test:scene-map:
    desc: Verify scene-bound context, frozen map admission and resume identity
    cmds:
      - cargo test --offline -p auralis-translation --test scene_map --test planned_batches
      - cargo test --offline -p auralis-translation-formats --test srt_context_plan
      - cargo test --offline -p auralis-translation-cli --test context_v5_admission
  test:long-scene-plan:
    desc: Check exact coverage and scene isolation across 1024, 4096 and 10000 owned targets
    cmds:
      - cargo test --offline -p auralis-translation --test long_scene_planner
  eval:cli:long:v5:scene:
    desc: Kill and resume a 1024-cue authored v5 scene SRT under the actual tokenizer budget
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-1.8B-Q4_K_M.gguf'
    cmds:
      - task: eval:load:checks
      - task: test:long-scene-plan
      - task: build:release
      - target/release/auralis-translation-cli.exe doctor models/manifests/hy_mt2_1_8b_q4_k_m.context_v5_scene.experimental.json .cache/models/Hy-MT2-1.8B-Q4_K_M.gguf
      - node eval/scripts/cli-long-v5-scene.mjs
  eval:regression:check:
    desc: Validate permanent failure evidence and required related and negative controls
    cmds:
      - node --test --test-isolation=none eval/scripts/tests/regression-index.test.mjs
      - node eval/scripts/check-regression-index.mjs
      - node eval/scripts/check-scene-pronoun-regression.mjs
  test:context-v5:
    desc: Verify the experimental v5 request and strict response boundary
    cmds:
      - cargo test --offline -p auralis-translation-llamacpp --test context_v5 --test profile_contract
      - cargo test --offline -p auralis-translation-cli --test context_v5_admission
  test:v5-terms:
    desc: Verify source-scoped v5 terms, bounded prompt admission and durable ledger identity
    cmds:
      - cargo test --offline -p auralis-translation --test approved_terms
      - cargo test --offline -p auralis-translation-formats --test srt_approved_terms
      - cargo test --offline -p auralis-translation-llamacpp --test v5_terms
      - cargo test --offline -p auralis-translation-cli --test v5_terms_admission
  eval:v5-terms:check:
    desc: Check the bounded paired real-model terms probe before execution
    cmds:
      - node --check eval/scripts/scene-context-smoke.mjs
      - node --test --test-isolation=none eval/scripts/tests/scene-request-budget.test.mjs
  eval:v5-terms:paired:
    desc: Compare synthetic source-scoped terms against no terms on three identical authored scenes
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-1.8B-Q4_K_M.gguf'
      AURALIS_SCENE_DATASET: eval/corpora/v5-terms-paired-v1.json
      AURALIS_SCENE_CASE_IDS: t01,t02,t03
      AURALIS_SCENE_TERMS_MODE: '1'
      AURALIS_SCENE_EXPERIMENT: v5-terms-paired-v2
    cmds:
      - task: eval:v5-terms:check
      - task: build:release
      - node eval/scripts/scene-context-smoke.mjs
  eval:context:scene:smoke:
    desc: Compare bounded real v5 source context on two identical authored Chinese scenes
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-1.8B-Q4_K_M.gguf'
    cmds:
      - task: eval:context:scene:check
      - task: build:release
      - node eval/scripts/scene-context-smoke.mjs
  eval:context:scene:check:
    desc: Check the bounded paired scene benchmark script before running a model
    cmds:
      - node --check eval/scripts/scene-context-smoke.mjs
  eval:context:scene:regression:
    desc: Run the observed pronoun failure and three new same-source paired controls
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-1.8B-Q4_K_M.gguf'
      AURALIS_SCENE_DATASET: eval/corpora/scene-pronoun-regression-v1.json
      AURALIS_SCENE_CASE_IDS: r01,r02,r03,r04
      AURALIS_SCENE_EXPERIMENT: scene-pronoun-regression-v1
    cmds:
      - task: eval:context:scene:check
      - task: build:release
      - node eval/scripts/scene-context-smoke.mjs
  eval:context:scene:after-terms:
    desc: Recheck the frozen actor-number regression after changing the v5 prompt template
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-1.8B-Q4_K_M.gguf'
      AURALIS_SCENE_DATASET: eval/corpora/scene-pronoun-regression-v1.json
      AURALIS_SCENE_CASE_IDS: r01,r02,r03,r04
      AURALIS_SCENE_EXPERIMENT: scene-pronoun-after-terms-v1
    cmds:
      - task: eval:v5-terms:check
      - task: build:release
      - node eval/scripts/scene-context-smoke.mjs
  eval:context:v5:smoke:
    desc: Run bounded real-model v5 JSON admission on the frozen authored twenty lines
    env:
      AURALIS_DEMO_PROFILE: models/manifests/hy_mt2_1_8b_q4_k_m.context_v5.experimental.json
      AURALIS_DEMO_ROOT: .cache/eval/context-v5-smoke
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-1.8B-Q4_K_M.gguf'
      AURALIS_SERVER_READINESS_MS: '30000'
    cmds:
      - task: build:release
      - node eval/scripts/public-demo-benchmark.mjs
  eval:context:v5:regression:
    desc: Repeat observed placeholder failures plus new related and unrelated Chinese controls
    env:
      AURALIS_DEMO_PROFILE: models/manifests/hy_mt2_1_8b_q4_k_m.context_v5.experimental.json
      AURALIS_DEMO_DATASET: eval/corpora/v5-placeholder-regression-v1.json
      AURALIS_DEMO_ROOT: .cache/eval/context-v5-regression
      AURALIS_FORBIDDEN_OUTPUT: Русский текст
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-1.8B-Q4_K_M.gguf'
      AURALIS_SERVER_READINESS_MS: '30000'
    cmds:
      - task: build:release
      - node eval/scripts/public-demo-benchmark.mjs
  eval:context:cases:build:
    desc: Rebuild the authored context corpus from its seed table
    cmds:
      - node eval/scripts/build-context-cases.mjs
  eval:context:cases:check:
    desc: Validate authored four-scenario Chinese context contrasts and frozen IDs
    cmds:
      - node --test --test-isolation=none eval/scripts/tests/context-cases.test.mjs
      - node eval/scripts/check-context-cases.mjs eval/corpora/context-contrasts-v1.json
  eval:report:check:
    desc: Validate versioned comparison evidence and failure-retention controls
    cmds:
      - node --test --test-isolation=none eval/scripts/tests/experiment-record.test.mjs
      - node eval/scripts/check-experiment-record.mjs eval/reports/experiment-record-example-v1.json
  eval:data:check:
    desc: Validate source inventory examples and cross-source admission controls
    cmds:
      - node --test --test-isolation=none eval/scripts/tests/source-inventory.test.mjs
      - node eval/scripts/check-source-inventory.mjs eval/corpora/source-inventory-example-v1.json
  plan:check:
    desc: Validate canonical delivery backlog states, dependencies and completion evidence
    cmds:
      - node eval/scripts/check-delivery-plan.mjs
  model:7b:smoke:
    desc: Verify the real 7B launcher reaches readiness and cleans up its runtime
    cmds:
      - task: build:release
      - node eval/scripts/serve-local-model.mjs models/manifests/hy_mt2_7b_q4_k_m.fidelity.experimental.json .cache/models/Hy-MT2-7B-Q4_K_M.gguf --verify-only
  model:7b:fetch:
    desc: Acquire and hash-check the pinned 7B assets into an ignored cache
    cmds:
      - task: build:release
      - target/release/auralis-translation-cli.exe fetch-release models/releases/hy_mt2_7b_q4_k_m.windows_x64_cpu.experimental.json models/manifests/hy_mt2_7b_q4_k_m.fidelity.experimental.json cpu "{{.ROOT_DIR}}/.cache/models"
  model:7b:install:
    desc: Install the verified experimental 7B CPU package separately from desktop selection
    cmds:
      - task: build:release
      - target/release/auralis-translation-cli.exe install-offline models/releases/hy_mt2_7b_q4_k_m.windows_x64_cpu.experimental.json models/manifests/hy_mt2_7b_q4_k_m.fidelity.experimental.json cpu "{{.ROOT_DIR}}/.cache/models" "{{.ROOT_DIR}}/.cache/installed-models"
  model:7b:serve:
    desc: Verify and serve the separate experimental 7B fidelity model on loopback
    cmds:
      - task: build:release
      - node eval/scripts/serve-local-model.mjs models/manifests/hy_mt2_7b_q4_k_m.fidelity.experimental.json .cache/models/Hy-MT2-7B-Q4_K_M.gguf
  model:7b:doctor:
    desc: Verify the downloaded 7B file against the pinned fidelity profile
    cmds:
      - task: build:release
      - target/release/auralis-translation-cli.exe doctor models/manifests/hy_mt2_7b_q4_k_m.fidelity.experimental.json .cache/models/Hy-MT2-7B-Q4_K_M.gguf
  eval:models:compare:
    desc: Repeat both model sizes on the same two frozen development datasets
    cmds:
      - task: build:release
      - node eval/scripts/model-size-comparison.mjs
  test:model-profiles:
    desc: Verify pinned model profiles and package identity boundaries
    cmds:
      - cargo test --offline -p auralis-translation-llamacpp --test profile_contract --test release_manifest
  eval:currency-prompts:
    desc: Explore direct terminology prompts before selecting a versioned file profile
    cmds:
      - node eval/scripts/currency-prompt-probe.mjs
  eval:currency-controls:
    desc: Repeat independent Chinese prices, named foreign currencies and nonmonetary pieces
    env:
      AURALIS_DEMO_PROFILE: models/manifests/hy_mt2_1_8b_q4_k_m.fidelity.experimental.json
      AURALIS_DEMO_DATASET: eval/corpora/currency-controls-v1.json
    cmds:
      - task: build:release
      - node eval/scripts/public-demo-benchmark.mjs
  eval:public-demo:fidelity:
    desc: Compare the Chinese fidelity profile on the original twenty development lines
    env:
      AURALIS_DEMO_PROFILE: models/manifests/hy_mt2_1_8b_q4_k_m.fidelity.experimental.json
    cmds:
      - task: build:release
      - node eval/scripts/public-demo-benchmark.mjs
  test:fidelity:
    desc: Verify profile versioning, Chinese admission and unchanged legacy provider behavior
    cmds:
      - cargo test --offline -p auralis-translation-llamacpp --test profile_contract --test protocol
  site:preview:
    desc: Preview the single report on loopback without exposing repository files
    cmds:
      - node eval/scripts/preview-public-demo.mjs
  site:build:
    desc: Rebuild the single HTML report from frozen real benchmark evidence
    cmds:
      - node eval/scripts/public-demo-site.mjs
  site:capture:
    desc: Deliberately replace report evidence with the latest successful authored benchmark
    cmds:
      - node eval/scripts/public-demo-site.mjs --capture
  site:check:
    desc: Verify report data integrity, embedded scripts and public artifact boundaries
    cmds:
      - node eval/scripts/check-public-demo-site.mjs
  eval:public-demo:
    desc: Measure three real checked-model runs on twenty authored Chinese SRT examples
    cmds:
      - task: build:release
      - node eval/scripts/public-demo-benchmark.mjs
  test:result-edits:
    desc: Verify immutable edit ancestry, explicit historical branches, concurrent writers and migration
    cmds:
      - cargo test --offline -p auralis-translation-sqlite --test result_edits --test result_branches --test vtt_result_branches --test migrations --test project_cleanup
  test:preparation:
    desc: Verify cancellable model hashing and readiness HTTP headers/body cleanup
    cmds:
      - cargo test --offline -p auralis-translation-llamacpp --test preparation_hash --test hash_diagnostics --test request_cancellation --test offline_install
      - cargo test --offline -p auralis-translation-cli --test preparation_pause
  test:admission:
    desc: Verify stale start rejection, repeated pause, competing attempts and v4 migration
    cmds:
      - cargo test --offline -p auralis-translation-sqlite --test attempt_admission --test migrations
  test:cli:protocol:
    desc: Verify machine JSON input/output, durable progress, review exit, interruption and recovery
    cmds:
      - cargo test --offline -p auralis-translation-cli --test machine_protocol
  test:cli:packages:
    desc: Verify separate model installation through machine requests, receipts, partial failures and legacy output
    cmds:
      - cargo test --offline -p auralis-translation-cli --test machine_packages
      - cargo test --offline -p auralis-translation-llamacpp --test asset_download --test offline_install
  eval:cli:packages:
    desc: Verify machine package receipts against separately supplied real pinned assets; retain outputs only in ignored storage
    requires:
      vars: [ASSET_DIR]
    env:
      AURALIS_PACKAGE_PROBE_ASSET_DIR: '{{.ASSET_DIR}}'
    cmds:
      - task: build:release
      - task: test:cli:packages
      - node eval/scripts/cli-package-probe.mjs
  eval:cli:protocol:
    desc: Verify machine JSON/JSONL with a supplied checked model and independent authored comparison inputs
    cmds:
      - task: build:release
      - task: test:cli:protocol
      - node eval/scripts/cli-machine-probe.mjs
  eval:clean-windows:check:
    desc: Verify separate QA preparation, installer identity and unexecuted report boundaries
    cmds:
      - node --test eval/scripts/tests/clean-windows-qa.test.mjs
  eval:clean-windows:prepare:
    desc: Copy an audited MSI and independent authored diagnostics into a new QA directory without model weights
    requires:
      vars: [AURALIS_ROOT, OUTPUT_DIR, AURALIS_REVISION, TRANSLATE_REVISION]
    cmds:
      - task: eval:clean-windows:check
      - node eval/scripts/clean-windows-qa.mjs "{{.AURALIS_ROOT}}" "{{.OUTPUT_DIR}}" "{{.AURALIS_REVISION}}" "{{.TRANSLATE_REVISION}}"
  fetch:
    cmds:
      - cargo fetch
  build:
    cmds:
      - cargo build --workspace --offline
  build:release:
    desc: Build the optimized standalone CLI without downloading dependencies or models
    cmds:
      - cargo build --release --offline -p auralis-translation-cli
  test:
    cmds:
      - cargo test --workspace --offline
  test:verified-server:
    cmds:
      - cargo test --offline -p auralis-translation-cli --test verified_server
  test:request-cancellation:
    desc: Verify response-header/body interruption, provider reuse, and durable CLI pause
    cmds:
      - cargo test --offline -p auralis-translation-llamacpp --test request_cancellation
      - cargo test --offline -p auralis-translation --test retry_policy
      - cargo test --offline -p auralis-translation-cli --test cli_resume pause_preserves_committed_blocks_and_resume_finishes
  test:retry-policy:
    desc: Verify transient-only retries through the provider, core and durable CLI
    cmds:
      - cargo test --offline -p auralis-translation-llamacpp --test request_cancellation
      - cargo test --offline -p auralis-translation --test retry_policy
      - cargo test --offline -p auralis-translation-cli --test cli_resume cli_profile_retry_limit_is_recorded_in_checkpoint
  fmt:
    cmds:
      - cargo fmt --all -- --check
  fmt:fix:
    cmds:
      - cargo fmt --all
  lint:
    cmds:
      - cargo clippy --workspace --all-targets --offline -- -D warnings
  check:
    cmds:
      - task: fmt
      - task: lint
      - task: test
  docs:check:
    desc: Check local file links in active English documentation and experiment records
    cmds:
      - node eval/scripts/check-doc-links.mjs
  inspect:
    cmds:
      - cargo run --offline -p auralis-translation-cli -- inspect {{.CLI_ARGS}}
  cli:
    cmds:
      - cargo run --offline -p auralis-translation-cli -- {{.CLI_ARGS}}
  eval:flores:verify:
    cmds:
      - cargo run --offline -p auralis-translation-eval -- verify-flores eval/corpora/flores200-archive-b8b0b767.json .cache/eval/flores200_dataset.tar.gz .cache/eval/flores200_dataset
  eval:flores:compare:
    cmds:
      - cargo run --offline -p auralis-translation-eval -- compare-flores eval/corpora/flores200-archive-b8b0b767.json .cache/eval/flores200_dataset.tar.gz .cache/eval/flores200_dataset {{.CLI_ARGS}}
  eval:cli:vtt:interruption:
    desc: Kill and resume a standalone WebVTT CLI run with an installed checked local model
    cmds:
      - task: build
      - node eval/scripts/cli-vtt-interruption.mjs
  eval:file:checks:
    desc: Verify the auxiliary file comparison harness rejects structure and identity changes
    cmds:
      - node --test eval/scripts/tests/file-probe.test.mjs
      - node --test eval/scripts/tests/profile-comparison.test.mjs
  eval:cli:flores:file:
    desc: Run real Chinese sentence comparisons through a durable SRT transport fixture; keep data and reports in ignored storage
    cmds:
      - task: build
      - task: eval:file:checks
      - node eval/scripts/cli-flores-file.mjs
  eval:cli:flores:profiles:
    desc: Compare pinned decoding and prompt variants through identical local dev sentence fixtures without downloading assets
    cmds:
      - task: build
      - task: eval:file:checks
      - node eval/scripts/cli-flores-profiles.mjs
  eval:profiles:verify:
    desc: Verify a completed local comparison against the pinned matrix and retained artifact hashes without inference
    requires:
      vars: [REPORT_DIR]
    cmds:
      - node eval/scripts/verify-profile-comparison.mjs "{{.REPORT_DIR}}"
  eval:load:checks:
    desc: Check synthetic long-file fixture, checkpoint preservation and process-capture contracts
    cmds:
      - node --test eval/scripts/tests/long-file.test.mjs
      - node --test eval/scripts/tests/local-process.test.mjs
  eval:cli:long:interruption:
    desc: Kill and resume real long SRT and WebVTT runs with supplied checked assets; retain local comparison and resource reports
    cmds:
      - task: build:release
      - task: eval:load:checks
      - node eval/scripts/cli-long-file.mjs
  eval:cli:request-pause:
    desc: Pause observed active checked-model inference, preserve checkpoints, resume SRT/WebVTT and re-export offline
    cmds:
      - task: build:release
      - task: test:request-cancellation
      - node eval/scripts/cli-request-pause.mjs
