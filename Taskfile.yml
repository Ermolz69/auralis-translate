version: "3"

tasks:
  eval:model:qwen3:acquire:preflight:
    desc: Verify the pinned official Qwen3 8B Q4 acquisition contract without network use
    cmds:
      - node --check eval/scripts/acquire-qwen3-8b-eval.mjs
      - node eval/scripts/acquire-qwen3-8b-eval.mjs --preflight
  eval:model:qwen3:acquire:head:
    desc: Check the pinned official Qwen3 weight headers without downloading it
    cmds:
      - task: eval:model:qwen3:acquire:preflight
      - node eval/scripts/acquire-qwen3-8b-eval.mjs --head
  eval:model:qwen3:acquire:
    desc: Download one pinned Qwen3 8B Q4 weight into ignored private storage
    cmds:
      - task: eval:model:qwen3:acquire:preflight
      - node eval/scripts/acquire-qwen3-8b-eval.mjs --acquire
  eval:model:qwen3:freeze:
    desc: Freeze six source-only cases and 36 exact paired requests before inference
    cmds:
      - node --check eval/scripts/probe-qwen3-8b-local-screen.mjs
      - node eval/scripts/probe-qwen3-8b-local-screen.mjs --freeze
  eval:model:qwen3:preflight:
    desc: Rehash the private source, both models, runtime and 36 frozen requests
    cmds:
      - node --check eval/scripts/probe-qwen3-8b-local-screen.mjs
      - node eval/scripts/probe-qwen3-8b-local-screen.mjs --preflight
  eval:model:qwen3:probe:
    desc: Run one bounded same-source Qwen3 versus v8 screen and retain every raw reply
    cmds:
      - task: eval:model:qwen3:preflight
      - node eval/scripts/probe-qwen3-8b-local-screen.mjs --probe
  eval:model:qwen3:report:
    desc: Capture source-free metrics and raw-response hashes from the retained matched run
    cmds:
      - node --check eval/scripts/check-qwen3-8b-local-screen.mjs
      - node eval/scripts/check-qwen3-8b-local-screen.mjs --capture
  eval:model:qwen3:check:
    desc: Replay 36 private raw replies against frozen requests and the public report
    cmds:
      - node --check eval/scripts/check-qwen3-8b-local-screen.mjs
      - node eval/scripts/check-qwen3-8b-local-screen.mjs
  eval:model:qwen3:regressions:check:
    desc: Verify Qwen3 major modifier loss and repeated Russian agreement controls
    cmds:
      - task: eval:model:qwen3:check
      - node --check eval/scripts/check-qwen3-8b-regressions.mjs
      - node eval/scripts/check-qwen3-8b-regressions.mjs
  eval:regression:catalog:v57:write:
    desc: Create the versioned REG-081/082 catalog after checked Qwen3 evidence
    cmds:
      - task: eval:model:qwen3:regressions:check
      - node --check eval/scripts/build-regression-catalog-v57.mjs
      - node eval/scripts/build-regression-catalog-v57.mjs --write
  eval:regression:catalog:v57:check:
    desc: Verify the portable v56 to v57 catalog and both new Qwen regressions
    cmds:
      - task: eval:model:qwen3:regressions:check
      - node --check eval/scripts/build-regression-catalog-v57.mjs
      - node eval/scripts/build-regression-catalog-v57.mjs
  eval:name-action:trace:
    desc: Trace all nine frozen NAME-01 regressions without inference or mutation
    cmds:
      - node eval/scripts/trace-name-action-v1.mjs
  test:name-action:
    desc: Verify the fail-closed proposal barrier and durable rejection
    env:
      CARGO_TARGET_DIR: '{{.ROOT_DIR}}/.cache/build/name-registry'
    cmds:
      - cargo test --offline -p auralis-translation-llamacpp --test name_action_admission
      - cargo test --offline -p auralis-translation-cli --test name_action_admission
  eval:name-action:freeze:
    desc: Freeze the single offline admission candidate and its zero-inference budget
    cmds:
      - task: name-registry:build
      - node eval/scripts/name-action-screen-v1.mjs --freeze
  name-action:prepare:
    desc: Write the separately pinned conservative admission profile
    cmds:
      - node eval/scripts/name-action-screen-v1.mjs --prepare
  eval:name-action:preflight:
    desc: Verify immutable screen inputs and model/runtime/code identities
    cmds:
      - node eval/scripts/name-action-screen-v1.mjs --preflight
  eval:name-action:probe:
    desc: Run one frozen offline replay; never call a model or inspect holdout
    cmds:
      - task: eval:name-action:preflight
      - node eval/scripts/name-action-screen-v1.mjs --probe
  eval:name-action:check:
    desc: Verify trace, rejection evidence and combined regression catalog
    cmds:
      - task: eval:name-action:trace
      - node eval/scripts/name-action-screen-v1.mjs --check
      - node eval/scripts/check-regression-catalog-v44.mjs
  test:name-registry:
    desc: Verify source name occurrences, scene isolation, SQLite revisions and recovery
    env:
      CARGO_TARGET_DIR: '{{.ROOT_DIR}}/.cache/build/name-registry'
    cmds:
      - cargo test --offline -p auralis-translation --test name_registry
      - cargo test --offline -p auralis-translation-formats --test srt_name_registry
      - cargo test --offline -p auralis-translation-sqlite --test name_registry
      - cargo test --offline -p auralis-translation-llamacpp --test name_registry
      - cargo test --offline -p auralis-translation-cli --test name_registry
  name-registry:check:
    desc: Verify the registry in an isolated Cargo target directory
    env:
      CARGO_TARGET_DIR: '{{.ROOT_DIR}}/.cache/build/name-registry'
    cmds:
      - task fmt
      - task lint
      - task test
  name-registry:build:
    desc: Build the experimental registry CLI without sharing parallel build artifacts
    env:
      CARGO_TARGET_DIR: '{{.ROOT_DIR}}/.cache/build/name-registry'
    cmds:
      - cargo build --offline -p auralis-translation-cli
  eval:name-registry:freeze:
    desc: Freeze the bounded source-only paired v8 name experiment before inference
    cmds:
      - task: name-registry:build
      - node --check eval/scripts/probe-source-name-registry-v1.mjs
      - node eval/scripts/probe-source-name-registry-v1.mjs --freeze
  eval:name-registry:preflight:
    desc: Verify frozen source, profiles, registry policy, model and executable hashes
    cmds:
      - node eval/scripts/probe-source-name-registry-v1.mjs --preflight
  eval:name-registry:probe:
    desc: Run one bounded paired real-model registry experiment with no retries
    cmds:
      - task: eval:name-registry:preflight
      - node eval/scripts/probe-source-name-registry-v1.mjs
  eval:name-registry:check:
    desc: Verify registry experiment raw journals, checkpoints, hashes and review decision
    cmds:
      - node eval/scripts/check-source-name-registry-v1.mjs
      - node eval/scripts/check-regression-catalog-v42.mjs
  eval:name-registry:audit:
    desc: Audit frozen experiment source content against the committed candidate without inference
    cmds:
      - task: eval:name-registry:check
      - node eval/scripts/check-source-name-registry-v1.mjs --audit-code
  eval:name-registry:report:
    desc: Extract immutable authored registry observations for separate AI assessment
    cmds:
      - node --check eval/scripts/check-source-name-registry-v1.mjs
      - node eval/scripts/check-source-name-registry-v1.mjs --write
  eval:data:commons:wikipedia-lesson:caption:preflight:
    desc: Verify bounded Commons Chinese Wikipedia lesson caption request
    cmds:
      - node --check eval/scripts/acquire-commons-wikipedia-lesson-caption.mjs
      - node eval/scripts/acquire-commons-wikipedia-lesson-caption.mjs --preflight
  eval:data:commons:wikipedia-lesson:caption:acquire:
    desc: Retain one private source Chinese caption and pinned Commons revision
    cmds:
      - task: eval:data:commons:wikipedia-lesson:caption:preflight
      - node eval/scripts/acquire-commons-wikipedia-lesson-caption.mjs
  eval:data:commons:wikipedia-lesson:caption:derive:
    desc: Preserve a byte-mapped strict SRT derivative of the original 37-cue track
    cmds:
      - node --test --test-isolation=none eval/scripts/tests/normalize-srt-millisecond-fields.test.mjs
      - node --check eval/scripts/derive-commons-wikipedia-lesson-caption.mjs
      - node eval/scripts/derive-commons-wikipedia-lesson-caption.mjs --preflight
      - node eval/scripts/derive-commons-wikipedia-lesson-caption.mjs
  eval:data:commons:wikipedia-lesson:candidate:check:
    desc: Reject original short millisecond fields and inspect the mapped strict derivative
    cmds:
      - node --check eval/scripts/stage-commons-wikipedia-lesson-candidate.mjs
      - node eval/scripts/stage-commons-wikipedia-lesson-candidate.mjs
      - cargo build --offline -p auralis-translation-cli
      - node --check eval/scripts/check-commons-wikipedia-lesson-candidate.mjs
      - node eval/scripts/check-commons-wikipedia-lesson-candidate.mjs
      - node eval/scripts/check-source-inventory.mjs eval/corpora/commons-wikipedia-lesson-candidate-v1.json --require-candidate-bytes
      - node eval/scripts/check-source-candidate-inspection.mjs eval/corpora/commons-wikipedia-lesson-candidate-v1.json
  eval:data:commons:wikipedia-lesson:media:preflight:
    desc: Verify bounded Commons original video acquisition budget
    cmds:
      - node --check eval/scripts/acquire-commons-wikipedia-lesson-media.mjs
      - node eval/scripts/acquire-commons-wikipedia-lesson-media.mjs --preflight
  eval:data:commons:wikipedia-lesson:media:acquire:
    desc: Retain one matching private Chinese Wikipedia lesson video
    cmds:
      - task: eval:data:commons:wikipedia-lesson:media:preflight
      - node eval/scripts/acquire-commons-wikipedia-lesson-media.mjs
  eval:data:commons:wikipedia-lesson:media:check:
    desc: Measure pinned lesson streams and verify strict cue timing containment
    cmds:
      - cargo build --offline -p auralis-translation-cli
      - node --check eval/scripts/check-commons-wikipedia-lesson-media.mjs
      - node eval/scripts/check-commons-wikipedia-lesson-media.mjs --preflight
      - node eval/scripts/check-commons-wikipedia-lesson-media.mjs
  eval:data:commons:wikipedia-lesson:report:check:
    desc: Reconcile the source-free lesson report with private caption and media bytes
    cmds:
      - node --check eval/scripts/check-commons-wikipedia-lesson-report.mjs
      - node eval/scripts/check-commons-wikipedia-lesson-report.mjs
  eval:data:paywall:caption:preflight:
    desc: Verify the pinned CC BY 4.0 Chinese subtitle request and budget
    cmds:
      - node --check eval/scripts/acquire-paywall-chinese-caption.mjs
      - node eval/scripts/acquire-paywall-chinese-caption.mjs --preflight
  eval:data:paywall:caption:acquire:
    desc: Retain one private original Traditional Chinese subtitle file
    cmds:
      - task: eval:data:paywall:caption:preflight
      - node eval/scripts/acquire-paywall-chinese-caption.mjs
  eval:data:paywall:caption:inspect:
    desc: Verify the retained Chinese source hash and inspect with the strict CLI
    cmds:
      - cargo build --offline -p auralis-translation-cli
      - node --check eval/scripts/inspect-paywall-chinese-caption.mjs
      - node eval/scripts/inspect-paywall-chinese-caption.mjs
  eval:data:paywall:media:inventory:preflight:
    desc: Verify one bounded Internet Archive metadata request for matching video
    cmds:
      - node --check eval/scripts/inventory-paywall-media.mjs
      - node eval/scripts/inventory-paywall-media.mjs --preflight
  eval:data:paywall:media:inventory:
    desc: Retain one private metadata response identifying the 280 MiB video derivative
    cmds:
      - task: eval:data:paywall:media:inventory:preflight
      - node eval/scripts/inventory-paywall-media.mjs
  eval:data:paywall:media:acquire:preflight:
    desc: Verify one bounded OGV acquisition against pinned Archive metadata
    cmds:
      - node --check eval/scripts/acquire-paywall-media.mjs
      - node eval/scripts/acquire-paywall-media.mjs --preflight
  eval:data:paywall:media:acquire:
    desc: Retain the CC BY 4.0 OGV derivative for source alignment review
    cmds:
      - task: eval:data:paywall:media:acquire:preflight
      - node eval/scripts/acquire-paywall-media.mjs
  eval:data:paywall:media:check:
    desc: Verify exact OGV bytes, decoded stream metadata and subtitle time coverage
    cmds:
      - node --check eval/scripts/check-paywall-media.mjs
      - node eval/scripts/check-paywall-media.mjs
  eval:data:paywall:audio:sample:
    desc: Decode beginning, middle and end source-audio windows linked to Chinese cues
    cmds:
      - node --check eval/scripts/sample-paywall-audio.mjs
      - node eval/scripts/sample-paywall-audio.mjs
  eval:data:paywall:candidate:stage:
    desc: Stage a hash-checked private copy of the original Chinese SRT
    cmds:
      - node --check eval/scripts/stage-paywall-candidate.mjs
      - node eval/scripts/stage-paywall-candidate.mjs
  eval:data:paywall:candidate:check:
    desc: Verify the Paywall candidate inventory and exact retained source bytes
    cmds:
      - task: eval:data:paywall:candidate:stage
      - cargo build --offline -p auralis-translation-cli
      - node eval/scripts/check-source-inventory.mjs eval/corpora/paywall-chinese-candidate-v1.json --require-candidate-bytes
      - node eval/scripts/check-source-candidate-inspection.mjs eval/corpora/paywall-chinese-candidate-v1.json
  eval:data:commons:sethlui:revision:preflight:
    desc: Verify one metadata-only Mandarin-caption revision query
    cmds:
      - node --check eval/scripts/inventory-commons-sethlui-revision.mjs
      - node eval/scripts/inventory-commons-sethlui-revision.mjs --preflight
  eval:data:commons:sethlui:revision:inventory:
    desc: Pin one Commons Chinese TimedText revision without downloading the caption
    cmds:
      - task: eval:data:commons:sethlui:revision:preflight
      - node eval/scripts/inventory-commons-sethlui-revision.mjs
  eval:data:commons:sethlui:caption:preflight:
    desc: Verify exact Commons Chinese caption revision and bounded GET
    cmds:
      - node --check eval/scripts/acquire-commons-sethlui-caption.mjs
      - node eval/scripts/acquire-commons-sethlui-caption.mjs --preflight
  eval:data:commons:sethlui:caption:acquire:
    desc: Retain one private pinned 12-minute Chinese caption candidate
    cmds:
      - task: eval:data:commons:sethlui:caption:preflight
      - node eval/scripts/acquire-commons-sethlui-caption.mjs
  eval:data:commons:sethlui:caption:check:
    desc: Verify exact restaurant SRT bytes and reject captions beyond the video duration
    cmds:
      - node --test-isolation=none --test eval/scripts/tests/cue-media-coverage.test.mjs
      - node --check eval/scripts/check-commons-sethlui-caption.mjs
      - node eval/scripts/check-commons-sethlui-caption.mjs
  eval:data:commons:sethlui:media:preflight:
    desc: Verify bounded Commons restaurant media acquisition
    cmds:
      - node --check eval/scripts/acquire-commons-sethlui-media.mjs
      - node eval/scripts/acquire-commons-sethlui-media.mjs --preflight
  eval:data:commons:sethlui:media:acquire:
    desc: Retain one private restaurant 240p video for duration and speech review
    cmds:
      - task: eval:data:commons:sethlui:media:preflight
      - node eval/scripts/acquire-commons-sethlui-media.mjs
  eval:data:commons:sethlui:media:derive:preflight:
    desc: Verify pinned restaurant media stream and SRT derivative inputs
    cmds:
      - node --check eval/scripts/derive-commons-sethlui-in-duration.mjs
      - node eval/scripts/derive-commons-sethlui-in-duration.mjs --preflight
  eval:data:commons:sethlui:media:derive:
    desc: Verify pinned media streams and preserve a mapped in-duration SRT derivative
    cmds:
      - task: eval:data:commons:sethlui:media:derive:preflight
      - node eval/scripts/derive-commons-sethlui-in-duration.mjs
  eval:data:commons:sethlui:candidate:stage:
    desc: Preserve the mapped restaurant derivative as a private candidate copy
    cmds:
      - node --check eval/scripts/stage-commons-sethlui-candidate.mjs
      - node eval/scripts/stage-commons-sethlui-candidate.mjs
  eval:data:commons:sethlui:candidate:check:
    desc: Verify mapped restaurant derivative, stream duration and strict inventory
    cmds:
      - node --check eval/scripts/stage-commons-sethlui-candidate.mjs
      - node eval/scripts/stage-commons-sethlui-candidate.mjs --check
      - node eval/scripts/check-source-inventory.mjs eval/corpora/commons-sethlui-candidate-v1.json --require-candidate-bytes
      - node eval/scripts/check-source-candidate-inspection.mjs eval/corpora/commons-sethlui-candidate-v1.json
  eval:data:commons:sethlui:audio:preflight:
    desc: Verify bounded source-audio windows and fixed cue overlap IDs
    cmds:
      - node --check eval/scripts/sample-commons-sethlui-audio.mjs
      - node eval/scripts/sample-commons-sethlui-audio.mjs --preflight
  eval:data:commons:sethlui:audio:sample:
    desc: Decode three private source-audio windows for human Chinese speech review
    cmds:
      - task: eval:data:commons:sethlui:audio:preflight
      - node eval/scripts/sample-commons-sethlui-audio.mjs
  eval:data:commons:sethlui:audio:check:
    desc: Recheck the pinned private source-audio packet without claiming listening
    cmds:
      - node --check eval/scripts/check-commons-sethlui-audio.mjs
      - node eval/scripts/check-commons-sethlui-audio.mjs
  eval:natural:sethlui:v6:preflight:
    desc: Verify pinned restaurant source and matched 1.8B/7B v6 full-file identities
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF_1B: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-1.8B-Q4_K_M.gguf'
      AURALIS_TEST_GGUF_7B: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-7B-Q4_K_M.gguf'
    cmds:
      - task: eval:data:commons:sethlui:candidate:check
      - node --check eval/scripts/probe-commons-sethlui-full-v6.mjs
      - node eval/scripts/probe-commons-sethlui-full-v6.mjs --preflight 1b
      - node eval/scripts/probe-commons-sethlui-full-v6.mjs --preflight 7b
  eval:natural:sethlui:v6:1b:probe:
    desc: Run one bounded full 263-cue restaurant translation with pinned 1.8B v6
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF_1B: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-1.8B-Q4_K_M.gguf'
      AURALIS_TEST_GGUF_7B: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-7B-Q4_K_M.gguf'
    cmds:
      - task: eval:natural:sethlui:v6:preflight
      - node eval/scripts/probe-commons-sethlui-full-v6.mjs 1b
  eval:natural:sethlui:v6:7b:probe:
    desc: Run one bounded full 263-cue restaurant translation with pinned 7B v6
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF_1B: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-1.8B-Q4_K_M.gguf'
      AURALIS_TEST_GGUF_7B: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-7B-Q4_K_M.gguf'
    cmds:
      - task: eval:natural:sethlui:v6:preflight
      - node eval/scripts/probe-commons-sethlui-full-v6.mjs 7b
  eval:natural:sethlui:v6:result:check:
    desc: Reconcile both immutable restaurant runs with raw replies, token preflights and durable state
    cmds:
      - node --check eval/scripts/check-commons-sethlui-full-v6-result.mjs
      - node eval/scripts/check-commons-sethlui-full-v6-result.mjs
  eval:natural:sethlui:v6:harness:check:
    desc: Verify failed CLI run IDs and elapsed time remain journaled in future probes
    cmds:
      - node --check eval/scripts/probe-commons-sethlui-full-v6.mjs
      - node --test --test-isolation=none eval/scripts/tests/cli-run-id.test.mjs
  eval:natural:sethlui:v6:7b:resume:preflight:
    desc: Verify the immutable failed 7B state, model and one copied continuation budget
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-7B-Q4_K_M.gguf'
    cmds:
      - node --check eval/scripts/resume-commons-sethlui-full-v6-7b.mjs
      - node eval/scripts/resume-commons-sethlui-full-v6-7b.mjs --preflight
  eval:natural:sethlui:v6:7b:resume:
    desc: Run exactly one frozen bounded 7B continuation from a copied 61-block state
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-7B-Q4_K_M.gguf'
    cmds:
      - task: eval:natural:sethlui:v6:7b:resume:preflight
      - node eval/scripts/resume-commons-sethlui-full-v6-7b.mjs
  eval:natural:sethlui:v6:7b:resume:result:check:
    desc: Reconcile the failed copied 7B continuation against raw replies and untouched original state
    cmds:
      - node --check eval/scripts/check-commons-sethlui-7b-resume-result.mjs
      - node eval/scripts/check-commons-sethlui-7b-resume-result.mjs
  eval:natural:sethlui:v6:7b:tail-retry:preflight:
    desc: Verify pinned restaurant, opt-in 7B retry manifest and current CLI build receipt
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF_7B: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-7B-Q4_K_M.gguf'
    cmds:
      - task: eval:cli:build:receipt:check
      - task: test:json-tail:retry
      - node --check eval/scripts/probe-commons-sethlui-json-tail-retry.mjs
      - node eval/scripts/probe-commons-sethlui-json-tail-retry.mjs --preflight
  eval:natural:sethlui:v6:7b:tail-retry:probe:
    desc: Run one bounded real 7B full-file retry experiment and retain failures
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF_7B: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-7B-Q4_K_M.gguf'
    cmds:
      - task: eval:natural:sethlui:v6:7b:tail-retry:preflight
      - node eval/scripts/probe-commons-sethlui-json-tail-retry.mjs
  eval:natural:sethlui:v6:7b:tail-retry:result:check:
    desc: Reconcile the private retry report with raw requests, state and original source
    cmds:
      - node --check eval/scripts/check-commons-sethlui-json-tail-retry-result.mjs
      - node eval/scripts/check-commons-sethlui-json-tail-retry-result.mjs
  eval:natural:sethlui:v6:7b:length-tail:preflight:
    desc: Verify the new checked length-tail retry and pinned release CLI before one full-file run
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF_7B: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-7B-Q4_K_M.gguf'
    cmds:
      - task: eval:cli:build:receipt:check
      - task: test:json-tail:retry
      - node --check eval/scripts/probe-commons-sethlui-json-tail-length-retry.mjs
      - node eval/scripts/probe-commons-sethlui-json-tail-length-retry.mjs --preflight
  eval:natural:sethlui:v6:7b:length-tail:probe:
    desc: Run one bounded 7B full-file attempt with opt-in length-tail retry
    env:
      AURALIS_TEST_LLAMA_SERVER: '{{.ROOT_DIR}}/.cache/runtime/llama/llama-server.exe'
      AURALIS_TEST_GGUF_7B: '{{.ROOT_DIR}}/.cache/models/Hy-MT2-7B-Q4_K_M.gguf'
    cmds:
      - task: eval:natural:sethlui:v6:7b:length-tail:preflight
      - node eval/scripts/probe-commons-sethlui-json-tail-length-retry.mjs
  eval:natural:sethlui:v6:7b:length-tail:result:check:
    desc: Reconcile every private v2 length-tail request with SQLite and source bytes
