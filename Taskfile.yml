      - node eval/scripts/build-commons-asus-v6-review-packet.mjs
  eval:natural:asus:v6:review:check:
    desc: Reverify the frozen source-only ASUS sample against 44 raw and accepted candidate windows
    cmds:
      - node --check eval/scripts/check-commons-asus-v6-ai-review.mjs
      - node eval/scripts/check-commons-asus-v6-ai-review.mjs
  eval:natural:asus:7b:resume:
