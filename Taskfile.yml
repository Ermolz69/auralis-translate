version: "3"

tasks:
  eval:data:commons:sethlui:revision:preflight:
    desc: Verify one metadata-only Mandarin-caption revision query
    cmds:
      - node --check eval/scripts/inventory-commons-sethlui-revision.mjs
      - node eval/scripts/inventory-commons-sethlui-revision.mjs --preflight
  eval:data:commons:sethlui:revision:inventory:
    desc: Pin one Commons Chinese TimedText revision without downloading the caption
    cmds:
      - task: eval:data:commons:sethlui:revision:preflight
      - node eval/scripts/inventory-commons-sethlui-revision.mjs
  eval:data:commons:sethlui:caption:preflight:
    desc: Verify exact Commons Chinese caption revision and bounded GET
    cmds:
      - node --check eval/scripts/acquire-commons-sethlui-caption.mjs
      - node eval/scripts/acquire-commons-sethlui-caption.mjs --preflight
  eval:data:commons:sethlui:caption:acquire:
    desc: Retain one private pinned 12-minute Chinese caption candidate
    cmds:
      - task: eval:data:commons:sethlui:caption:preflight
      - node eval/scripts/acquire-commons-sethlui-caption.mjs
  eval:data:youtube:xiaolin:preflight:
    desc: Verify a pinned one-call metadata-only Mandarin video inventory
    env:
      AURALIS_TEST_YTDLP: 'C:/Users/Ermolz/AppData/Local/Programs/yt-dlp/yt-dlp.exe'
    cmds:
      - node --test-isolation=none --test eval/scripts/tests/bounded-process-capture.test.mjs
      - node --check eval/scripts/inventory-youtube-xiaolin.mjs
      - node eval/scripts/inventory-youtube-xiaolin.mjs --preflight
  eval:data:youtube:xiaolin:inventory:
    desc: Retain one bounded YouTube subtitle-track inventory without media download
    env:
      AURALIS_TEST_YTDLP: 'C:/Users/Ermolz/AppData/Local/Programs/yt-dlp/yt-dlp.exe'
    cmds:
      - task: eval:data:youtube:xiaolin:preflight
      - node eval/scripts/inventory-youtube-xiaolin.mjs
  eval:data:youtube:xiaolin:check:
    desc: Recheck retained Mandarin source metadata and sandbox-failure evidence offline
    cmds:
      - task: eval:data:youtube:xiaolin:preflight
      - node --check eval/scripts/check-youtube-xiaolin-inventory.mjs
      - node eval/scripts/check-youtube-xiaolin-inventory.mjs
  site:live:check:
    desc: Compare the live GitHub Pages HTML byte-for-byte with the committed local report
    cmds:
      - task: site:check
      - node --check eval/scripts/check-live-pages.mjs
      - node eval/scripts/check-live-pages.mjs
  eval:data:commons:train:media:inventory:
    desc: Inventory one bounded Commons train-video derivative metadata response
    cmds:
      - node --check eval/scripts/inventory-commons-train-media.mjs
      - node eval/scripts/inventory-commons-train-media.mjs
  eval:data:commons:train:media:inventory:check:
    desc: Recheck the retained Commons train metadata and exact source identity offline
    cmds:
      - node --check eval/scripts/check-commons-train-media-inventory.mjs
      - node eval/scripts/check-commons-train-media-inventory.mjs
  eval:data:commons:train:media:acquire:
    desc: Acquire one private, size-bounded 240p Commons train-video copy
    cmds:
      - task: eval:data:commons:train:media:inventory:check
      - node --check eval/scripts/acquire-commons-train-240p.mjs
      - node eval/scripts/acquire-commons-train-240p.mjs
  eval:data:commons:train:media:streams:
    desc: Rehash the private train-video copy and inspect its exact audio/video streams
    cmds:
      - node --check eval/scripts/check-commons-train-240p-streams.mjs
      - node eval/scripts/check-commons-train-240p-streams.mjs
  eval:data:commons:vivo:caption:acquire:
    desc: Acquire one pinned Chinese SRT revision for the 18-minute Geekerwan interview
    cmds:
      - node --check eval/scripts/acquire-commons-vivo-caption.mjs
      - node eval/scripts/acquire-commons-vivo-caption.mjs
  eval:data:commons:geekerwan:captions:acquire:
    desc: Acquire two pinned private Geekerwan Chinese SRT candidates once each
    cmds:
      - node --check eval/scripts/acquire-commons-geekerwan-two-captions.mjs
      - node eval/scripts/acquire-commons-geekerwan-two-captions.mjs
  eval:data:commons:geekerwan:captions:check:
    desc: Verify both retained original Geekerwan subtitles with the strict CLI
    cmds:
      - node --check eval/scripts/stage-commons-geekerwan-two-captions.mjs
      - node eval/scripts/stage-commons-geekerwan-two-captions.mjs
      - node eval/scripts/check-source-inventory.mjs eval/corpora/commons-geekerwan-two-scenes-candidate-v1.json --require-candidate-bytes
      - node eval/scripts/check-source-candidate-inspection.mjs eval/corpora/commons-geekerwan-two-scenes-candidate-v1.json
