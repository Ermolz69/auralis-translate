[package]
name = "auralis-translation-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
auralis-translation = { path = "../auralis-translation" }
auralis-translation-formats = { path = "../auralis-translation-formats" }
auralis-translation-llamacpp = { path = "../auralis-translation-llamacpp" }
auralis-translation-sqlite = { path = "../auralis-translation-sqlite" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
uuid = { version = "1.26.1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
