[package]
name = "auralis-translation-llamacpp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
auralis-translation = { path = "../auralis-translation" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
uuid = { version = "1.26.1", features = ["v4"] }
tokio = { version = "1.53.1", features = ["rt", "time", "net", "macros"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["json"] }
