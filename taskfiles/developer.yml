version: "3"

tasks:
  fmt:
    cmds:
      - cargo fmt --all -- --check
  fmt:fix:
    cmds:
      - cargo fmt --all
  lint:
    cmds:
      - cargo clippy --workspace --all-targets --offline -- -D warnings
  test:
    cmds:
      - cargo test --workspace --offline
  check:
    cmds:
      - task: fmt
      - task: lint
      - task: test
  docs:check:
    desc: Check local file links in active English documentation and experiment records
    cmds:
      - node eval/scripts/check-doc-links.mjs
  plan:check:
    desc: Validate canonical delivery backlog states, dependencies and completion evidence
    cmds:
      - node eval/scripts/check-delivery-plan.mjs
  inspect:
    cmds:
      - cargo run --offline -p auralis-translation-cli -- inspect {{.CLI_ARGS}}
  cli:
    cmds:
      - cargo run --offline -p auralis-translation-cli -- {{.CLI_ARGS}}
